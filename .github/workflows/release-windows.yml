name: Release Windows (Priority 1)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release-windows:
    name: Build & Publish Windows Installers (.exe + .msi)
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install workspace Tauri CLI
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run Rust backend tests
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Run frontend UI & IPC tests
        run: npm --prefix frontend test

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Build & Bundle Windows Installers via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional Authenticode signing secrets (configure Tauri windows.signCommand if supplied):
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: backend
          tauriScript: ..\node_modules\.bin\tauri.cmd
          tagName: v__VERSION__
          releaseName: "EmbedBay v__VERSION__"
          releaseBody: |
            ## Windows Installers (`x64`)
            - **Recommended (Per-User, no admin prompt):** `EmbedBay_*_x64-setup.exe` (NSIS)
            - **Enterprise / MSI:** `EmbedBay_*_x64_en-US.msi` (WiX)

            Requires Windows 10/11 (`x86_64`) and Microsoft Edge WebView2 Runtime.

            ---
            **Integrity & Privacy:** Installers are built directly from this tagged commit via GitHub Actions. If Windows SmartScreen warns on first launch (unsigned community build), click **More info → Run anyway**. In-app updates are Ed25519-verified and engine binaries are SHA-256-verified. Zero telemetry; see [CODE_SIGNING_POLICY.md](https://github.com/HeronKyaw/embedbay/blob/main/CODE_SIGNING_POLICY.md).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
