name: Release Windows (Priority 1)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release-windows:
    name: Build & Publish Windows Installers (.exe + .msi)
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run Rust backend tests
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Build & Bundle Windows Installers via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional Authenticode signing secrets (configure Tauri windows.signCommand if supplied):
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: backend
          tagName: v__VERSION__
          releaseName: "EmbedBay v__VERSION__"
          releaseBody: "See installer artifacts attached below (`*-setup.exe` NSIS & `*_en-US.msi` WiX)."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
