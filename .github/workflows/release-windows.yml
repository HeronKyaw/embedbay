name: Release Windows (Priority 1)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release-windows:
    name: Build & Publish Windows Installers (.exe + .msi)
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install workspace Tauri CLI
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run Rust backend tests
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Run frontend UI & IPC tests
        run: npm --prefix frontend test

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Prepare release notes from CHANGELOG.md
        id: release_notes
        shell: pwsh
        run: |
          $conf = Get-Content backend/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $conf.version
          $section = ""

          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $inSection = $false
            $buf = New-Object System.Collections.Generic.List[string]
            foreach ($line in $lines) {
              if ($line -match "^##\s+v?$([regex]::Escape($version))(\s|$)") {
                $inSection = $true
                continue
              }
              if ($inSection -and $line -match "^##\s+") {
                break
              }
              if ($inSection) {
                $buf.Add($line)
              }
            }
            $section = ($buf -join "`n").Trim()
          }

          if (-not $section) {
            $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
            if ($prevTag) {
              $commits = git log "$prevTag..HEAD" --pretty=format:"- %s" --no-merges
            } else {
              $commits = git log -n 10 --pretty=format:"- %s" --no-merges
            }
            $section = "### Changes`n" + ($commits -join "`n")
          }

          $footer = @"

          ---
          ### Windows Installers (``x64``)
          - **Recommended (Per-User, no admin prompt):** ``EmbedBay_${version}_x64-setup.exe`` (NSIS)
          - **Enterprise / MSI:** ``EmbedBay_${version}_x64_en-US.msi`` (WiX)

          Requires Windows 10/11 (``x86_64``) and Microsoft Edge WebView2 Runtime. In-app updates are Ed25519-verified; see [CODE_SIGNING_POLICY.md](https://github.com/HeronKyaw/embedbay/blob/main/CODE_SIGNING_POLICY.md).
          "@

          $body = "$section`n$footer"
          $delimiter = "EOF_RELEASE_NOTES"
          "body<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build & Bundle Windows Installers via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional Authenticode signing secrets (configure Tauri windows.signCommand if supplied):
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: backend
          tauriScript: ..\node_modules\.bin\tauri.cmd
          tagName: v__VERSION__
          releaseName: "EmbedBay v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
